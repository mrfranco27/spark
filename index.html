<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rack</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #242424;
    position: relative;
}

/* ==========================================================
   WINDOWS
========================================================== */

.window {
    position: absolute;
    background: #aaa;
    border: 2px solid #151515;

    box-shadow:
        6px 6px 0 rgba(0,0,0,0.35),
        inset 1px 1px 0 rgba(255,255,255,0.25);

    overflow: hidden;
}

#rack {
    left: 50%;
    top: 50%;
    width: 700px;
    height: 480px;
    transform: translate(-50%, -50%);
}

#browser {
    left: 80px;
    top: 80px;
    width: 330px;
    height: 430px;
    z-index: 1;
}

/* ==========================================================
   TITLEBAR
========================================================== */

.titlebar {
    position: absolute;
    left: -2px;
    top: -2px;
    width: calc(100% + 4px);
    height: 30px;

    display: flex;
    align-items: center;

    background: #3c3c3c;

    border: 2px solid #151515;
    border-bottom: 2px solid #202020;

    color: #eee;

    font-size: 13px;
    font-weight: bold;

    cursor: move;
    z-index: 10;
}

.title {
    flex: 1;
    padding-left: 9px;
    pointer-events: none;
}

/* ==========================================================
   TOPBAR MENU BUTTONS
========================================================== */

.menu-area {
    height: 100%;
    display: flex;
    align-items: stretch;
}

.menu-button {
    width: 52px;
    height: 100%;

    border: 0;
    border-left: 1px solid #202020;

    background: #454545;
    color: #ddd;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.menu-button:hover {
    background: #5b5b5b;
}

.menu-button:active,
.menu-button.open {
    background: #303030;
}

/* ==========================================================
   DROPDOWN MENUS
========================================================== */

.dropdown {
    position: absolute;
    top: 28px;

    min-width: 190px;

    background: #d0d0d0;

    border: 2px solid #222;

    box-shadow:
        4px 4px 0 rgba(0,0,0,0.35);

    display: none;

    z-index: 100;
}

.dropdown.open {
    display: block;
}

.dropdown-item {
    height: 30px;

    display: flex;
    align-items: center;

    padding: 0 10px;

    color: #222;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.dropdown-item:hover {
    background: #e0b82f;
}

/* ==========================================================
   WINDOW BUTTON
========================================================== */

.window-button {
    width: 32px;
    height: 100%;

    border: 0;
    border-left: 1px solid #202020;

    background: #505050;
    color: #ddd;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.window-button:hover {
    background: #666;
}

.window-button:active {
    background: #333;
}

/* ==========================================================
   RACK CONTENT
========================================================== */

.content {
    position: absolute;

    left: 0;
    top: 30px;

    width: 100%;
    height: calc(100% - 30px);

    padding: 8px;

    background: #aaa;
}

/* ==========================================================
   PATTERN AREA
========================================================== */

.pattern-area {
    height: 112px;

    display: flex;
    align-items: center;

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    padding: 8px;

    margin-bottom: 7px;
}

.pattern-title {
    width: 90px;

    color: #ddd;

    font-size: 13px;
    font-weight: bold;

    text-align: center;
}

.pattern-grid {
    width: 150px;
    height: 90px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: 4px;
}

.pattern-button {
    border: 2px solid #777;

    background: #d0d0d0;

    color: #333;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.6);
}

.pattern-button:hover {
    background: #ddd;
}

.pattern-button:active {
    background: #aaa;
}

.pattern-button.selected {
    background: #e0b82f;

    border-color: #9b7b15;

    color: #222;
}

/* ==========================================================
   CONTROLS
========================================================== */

.controls {
    height: 38px;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 4px 5px;

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.15);

    margin-bottom: 7px;
}

.play-button,
.loop-button {
    height: 26px;

    border: 2px solid #292929;

    background: #555;
    color: #eee;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.play-button {
    width: 58px;
}

.loop-button {
    width: 58px;
}

.play-button:hover,
.loop-button:hover {
    background: #666;
}

.play-button:active,
.loop-button:active {
    background: #3b3b3b;
}

.loop-button.enabled {
    background: #e0b82f;
    border-color: #9b7b15;
    color: #222;
}

.tempo-label {
    color: #ddd;

    font-size: 12px;
    font-weight: bold;

    margin-left: 3px;
}

.tempo-input {
    width: 58px;
    height: 26px;

    border: 2px solid #444;

    background: #d0d0d0;
    color: #222;

    font-size: 12px;
    font-weight: bold;

    padding: 2px 5px;

    outline: none;
}

.tempo-input:focus {
    background: #e2e2e2;
}

/* ==========================================================
   CHANNEL RACK
========================================================== */

.channel-rack {
    width: 100%;
    height: calc(100% - 164px);

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    padding: 7px;

    overflow: hidden;
}

/* ==========================================================
   CHANNEL ROW
========================================================== */

.channel-row {
    height: 58px;

    display: flex;
    align-items: center;

    margin-bottom: 6px;
}

.channel-row:last-child {
    margin-bottom: 0;
}

/* ==========================================================
   SAMPLE BOX
========================================================== */

.sample-box {
    flex-shrink: 0;

    width: 115px;
    height: 52px;

    background: #555;

    border: 2px solid #303030;
    border-top-color: #707070;
    border-left-color: #707070;

    color: #ddd;

    display: flex;
    align-items: center;

    padding: 0 8px;

    overflow: hidden;
}

.sample-box:hover {
    background: #606060;
}

.sample-box.drag-over {
    background: #777;
    border-color: #e0b82f;
}

.sample-name {
    width: 100%;

    font-size: 11px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    pointer-events: none;
}

/* ==========================================================
   STEP AREA
========================================================== */

.steps {
    height: 52px;

    flex: 1;

    display: grid;

    grid-template-columns: repeat(16, 1fr);

    gap: 3px;

    margin-left: 7px;
}

/* ==========================================================
   STEP
========================================================== */

.step {
    min-width: 0;

    border: 2px solid #292929;

    cursor: pointer;

    transition:
        background 0.04s linear,
        filter 0.04s linear;
}

.step.group-blue {
    background: #41647d;
}

.step.group-red {
    background: #765050;
}

.step.active.group-blue,
.step.active.group-red {
    background: #e0b82f;
    border-color: #9b7b15;
}

.step:hover {
    filter: brightness(1.15);
}

.step.active:hover {
    filter: brightness(1.08);
}

.step.playing {
    filter: brightness(1.45);
}

.step.active.playing {
    background: #f5d65a;
    filter: brightness(1.05);
}

.step.group-start {
    margin-left: 3px;
}

/* ==========================================================
   EXPORT SETTINGS
========================================================== */

#exportSettings {
    left: 50%;
    top: 50%;
    width: 330px;
    height: 220px;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 20;
}

#exportSettings.open {
    display: block;
}

.export-settings-content {
    position: absolute;
    left: 0;
    top: 30px;
    width: 100%;
    height: calc(100% - 30px);
    padding: 12px;
    background: #aaa;
}

.export-setting-label {
    display: block;
    margin-bottom: 6px;
    color: #222;
    font-size: 12px;
    font-weight: bold;
}

.export-setting-select {
    width: 100%;
    height: 30px;
    border: 2px solid #444;
    background: #d0d0d0;
    color: #222;
    font-size: 12px;
    font-weight: bold;
    padding: 2px 5px;
    outline: none;
}

.export-setting-select:focus {
    background: #e2e2e2;
}

.export-button {
    position: absolute;
    left: 12px;
    bottom: 12px;
    width: calc(100% - 24px);
    height: 32px;
    border: 2px solid #292929;
    background: #555;
    color: #eee;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.export-button:hover {
    background: #666;
}

.export-button:active {
    background: #3b3b3b;
}

/* ==========================================================
   MINIMIZED
========================================================== */

.window.minimized {
    height: 30px;
}

.window.minimized .content,
.window.minimized .browser-content {
    display: none;
}

/* ==========================================================
   DRAGGING
========================================================== */

.window.dragging {
    box-shadow:
        8px 8px 0 rgba(0,0,0,0.4),
        inset 1px 1px 0 rgba(255,255,255,0.25);
}

/* ==========================================================
   BROWSER
========================================================== */

.browser-content {
    position: absolute;

    left: 0;
    top: 30px;

    width: 100%;
    height: calc(100% - 30px);

    padding: 7px;

    background: #aaa;

    overflow: hidden;
}

.tree {
    width: 100%;
    height: 100%;

    background: #c0c0c0;

    border: 2px solid #666;
    border-top-color: #444;
    border-left-color: #444;

    padding: 6px;

    overflow: auto;

    color: #222;

    font-size: 12px;
}

.tree-row {
    min-height: 22px;

    display: flex;
    align-items: center;

    white-space: nowrap;

    padding-right: 4px;
}

.tree-folder {
    font-weight: bold;
}

.tree-file {
    cursor: grab;

    border: 1px solid transparent;
}

.tree-file:hover {
    background: #d8d8d8;
    border-color: #999;
}

.tree-file:active {
    cursor: grabbing;
    background: #aaa;
}

.folder-icon {
    width: 18px;
    display: inline-block;
}

.file-icon {
    width: 18px;
    display: inline-block;
}

.file-name {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tree-message {
    color: #555;
    padding: 5px;
    font-size: 11px;
}
</style>

</head>

<script>

/* ==========================================================
   WINDOW MANAGER
========================================================== */

let highestZIndex = 10;

function bringToFront(windowElement) {

    highestZIndex++;

    windowElement.style.zIndex =
        highestZIndex;
}

document.querySelectorAll(".window").forEach(
    windowElement => {

        windowElement.addEventListener(
            "pointerdown",
            () => {

                bringToFront(windowElement);

            },
            true
        );

    }
);

/* ==========================================================
   WINDOW DRAGGING
========================================================== */

function setupWindowDrag(
    windowElement,
    titlebar,
    toggleButton
) {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    let minimized = false;

    toggleButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            bringToFront(windowElement);

            const rect =
                windowElement.getBoundingClientRect();

            windowElement.style.transform =
                "none";

            windowElement.style.left =
                rect.left + "px";

            windowElement.style.top =
                rect.top + "px";

            minimized =
                !minimized;

            windowElement.classList.toggle(
                "minimized",
                minimized
            );

            toggleButton.textContent =
                minimized
                    ? "□"
                    : "_";

        }
    );

    titlebar.addEventListener(
        "mousedown",
        event => {

            if (
                event.target.closest("button") ||
                event.target.closest(".dropdown")
            ) {
                return;
            }

            bringToFront(windowElement);

            dragging = true;

            windowElement.classList.add(
                "dragging"
            );

            const rect =
                windowElement.getBoundingClientRect();

            windowElement.style.transform =
                "none";

            windowElement.style.left =
                rect.left + "px";

            windowElement.style.top =
                rect.top + "px";

            offsetX =
                event.clientX -
                rect.left;

            offsetY =
                event.clientY -
                rect.top;

            event.preventDefault();

        }
    );

    document.addEventListener(
        "mousemove",
        event => {

            if (!dragging) {
                return;
            }

            const rect =
                windowElement.getBoundingClientRect();

            const maxLeft =
                Math.max(
                    0,
                    window.innerWidth -
                    rect.width
                );

            const maxTop =
                Math.max(
                    0,
                    window.innerHeight -
                    rect.height
                );

            const left =
                event.clientX -
                offsetX;

            const top =
                event.clientY -
                offsetY;

            windowElement.style.left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        maxLeft
                    )
                ) + "px";

            windowElement.style.top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        maxTop
                    )
                ) + "px";

        }
    );

    document.addEventListener(
        "mouseup",
        () => {

            if (!dragging) {
                return;
            }

            dragging = false;

            windowElement.classList.remove(
                "dragging"
            );

        }
    );

}

/* ==========================================================
   WINDOW SETUP
========================================================== */

const rackWindow =
    document.getElementById("rack");

const browserWindow =
    document.getElementById("browser");

setupWindowDrag(
    rackWindow,
    document.getElementById("rackTitlebar"),
    document.getElementById("toggleRack")
);

setupWindowDrag(
    browserWindow,
    document.getElementById("browserTitlebar"),
    document.getElementById("toggleBrowser")
);

/* ==========================================================
   PATTERN SYSTEM
========================================================== */

const PATTERN_COUNT = 9;
const ROW_COUNT = 4;
const STEP_COUNT = 16;

let currentPattern = 0;

const patterns = [];

for (
    let pattern = 0;
    pattern < PATTERN_COUNT;
    pattern++
) {

    const patternChannels = [];

    for (
        let channel = 0;
        channel < ROW_COUNT;
        channel++
    ) {

        patternChannels.push(
            new Array(STEP_COUNT).fill(false)
        );

    }

    patterns.push(patternChannels);

}

/* ==========================================================
   PATTERN BUTTONS
========================================================== */

const patternGrid =
    document.getElementById("patternGrid");

for (
    let pattern = 0;
    pattern < PATTERN_COUNT;
    pattern++
) {

    const button =
        document.createElement("button");

    button.className =
        "pattern-button";

    button.textContent =
        pattern + 1;

    button.dataset.pattern =
        pattern;

    button.addEventListener(
        "click",
        () => {

            switchPattern(pattern);

        }
    );

    patternGrid.appendChild(button);

}

function updatePatternButtons() {

    patternGrid
        .querySelectorAll(".pattern-button")
        .forEach(button => {

            const pattern =
                Number(button.dataset.pattern);

            button.classList.toggle(
                "selected",
                pattern === currentPattern
            );

        });

}

function switchPattern(pattern) {

    if (
        pattern < 0 ||
        pattern >= PATTERN_COUNT
    ) {
        return;
    }

    currentPattern =
        pattern;

    updatePatternButtons();

    renderCurrentPattern();

}

/* ==========================================================
   CHANNELS
========================================================== */

const channelRack =
    document.getElementById("channelRack");

const channels = [];

for (
    let row = 0;
    row < ROW_COUNT;
    row++
) {

    channels.push({

        name:
            "Sample " +
            (row + 1),

        buffer:
            null

    });

    const rowElement =
        document.createElement("div");

    rowElement.className =
        "channel-row";

    const sampleBox =
        document.createElement("div");

    sampleBox.className =
        "sample-box";

    const sampleName =
        document.createElement("div");

    sampleName.className =
        "sample-name";

    sampleName.textContent =
        "Sample " +
        (row + 1);

    sampleBox.appendChild(
        sampleName
    );

    sampleBox.addEventListener(
        "dragover",
        event => {

            if (
                event.dataTransfer.types.includes(
                    "application/x-rack-audio"
                )
            ) {

                event.preventDefault();

                event.dataTransfer.dropEffect =
                    "copy";

                sampleBox.classList.add(
                    "drag-over"
                );

            }

        }
    );

    sampleBox.addEventListener(
        "dragleave",
        () => {

            sampleBox.classList.remove(
                "drag-over"
            );

        }
    );

    sampleBox.addEventListener(
        "drop",
        async event => {

            event.preventDefault();

            sampleBox.classList.remove(
                "drag-over"
            );

            const url =
                event.dataTransfer.getData(
                    "application/x-rack-audio"
                );

            const filename =
                event.dataTransfer.getData(
                    "application/x-rack-name"
                );

            if (!url) {
                return;
            }

            await loadSampleIntoChannel(
                row,
                url,
                filename
            );

        }
    );

    rowElement.appendChild(
        sampleBox
    );

    /* ======================================================
       STEPS
    ====================================================== */

    const steps =
        document.createElement("div");

    steps.className =
        "steps";

    for (
        let step = 0;
        step < STEP_COUNT;
        step++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "step " +
            (
                Math.floor(step / 4) % 2 === 0
                    ? "group-blue"
                    : "group-red"
            );

        if (
            step === 4 ||
            step === 8 ||
            step === 12
        ) {

            cell.classList.add(
                "group-start"
            );

        }

        cell.dataset.row =
            row;

        cell.dataset.step =
            step;

        /*
            LEFT CLICK = ADD

            It can never turn an active step
            back off.
        */

        cell.addEventListener(
            "click",
            event => {

                event.preventDefault();

                patterns[currentPattern][row][step] =
                    true;

                cell.classList.add(
                    "active"
                );

            }
        );

        /*
            RIGHT CLICK = REMOVE
        */

        cell.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                patterns[currentPattern][row][step] =
                    false;

                cell.classList.remove(
                    "active"
                );

            }
        );

        steps.appendChild(cell);

    }

    rowElement.appendChild(
        steps
    );

    channelRack.appendChild(
        rowElement
    );

}

/* ==========================================================
   PATTERN RENDER
========================================================== */

function updateStepVisual(
    row,
    step
) {

    const cell =
        channelRack.querySelector(
            '.step[data-row="' +
            row +
            '"][data-step="' +
            step +
            '"]'
        );

    if (!cell) {
        return;
    }

    cell.classList.toggle(
        "active",
        patterns[currentPattern][row][step]
    );

}

function renderCurrentPattern() {

    for (
        let row = 0;
        row < ROW_COUNT;
        row++
    ) {

        for (
            let step = 0;
            step < STEP_COUNT;
            step++
        ) {

            updateStepVisual(
                row,
                step
            );

        }

    }

}

/* ==========================================================
   AUDIO
========================================================== */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioContext({
                latencyHint:
                    "interactive"
            });

    }

    return audioContext;

}

/* ==========================================================
   LOAD SAMPLE
========================================================== */

async function loadSampleIntoChannel(
    channelIndex,
    url,
    filename
) {

    const channel =
        channels[channelIndex];

    const context =
        getAudioContext();

    try {

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Could not load " + url
            );

        }

        const arrayBuffer =
            await response.arrayBuffer();

        const decoded =
            await context.decodeAudioData(
                arrayBuffer
            );

        channel.buffer =
            decoded;

        channel.name =
            filename;

        const rowElement =
            channelRack.children[
                channelIndex
            ];

        rowElement.querySelector(
            ".sample-name"
        ).textContent =
            filename;

    } catch (error) {

        console.error(
            "Could not load sample:",
            error
        );

    }

}

/* ==========================================================
   AUDIO CHECK
========================================================== */

function isAudioFile(filename) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    return [
        "wav",
        "mp3",
        "ogg",
        "m4a",
        "aac",
        "flac",
        "webm"
    ].includes(extension);

}

/* ==========================================================
   LOAD GITHUB FOLDER
========================================================== */

async function loadGitHubFolder(
    apiURL,
    parentElement,
    depth
) {

    const response =
        await fetch(apiURL);

    if (!response.ok) {

        throw new Error(
            "GitHub API request failed: " +
            response.status
        );

    }

    const entries =
        await response.json();

    entries.sort(
        (a, b) => {

            if (
                a.type !== b.type
            ) {

                return a.type === "dir"
                    ? -1
                    : 1;

            }

            return a.name.localeCompare(
                b.name
            );

        }
    );

    for (
        const entry of entries
    ) {

        if (
            entry.type === "dir"
        ) {

            createGitHubFolderRow(
                entry.name,
                parentElement,
                depth
            );

            await loadGitHubFolder(
                entry.url,
                parentElement,
                depth + 1
            );

        } else if (
            entry.type === "file" &&
            isAudioFile(entry.name)
        ) {

            createGitHubFileRow(
                entry.name,
                entry.download_url,
                parentElement,
                depth
            );

        }

    }

}

/* ==========================================================
   SEQUENCER
========================================================== */

const playButton =
    document.getElementById("playButton");

const loopButton =
    document.getElementById("loopButton");

const tempoInput =
    document.getElementById("tempoInput");

let playing = false;

let loopEnabled = true;

let currentStep = 0;

let nextStepTime = 0;

let schedulerTimer = null;

const SCHEDULE_AHEAD_TIME =
    0.1;

const SCHEDULER_INTERVAL =
    25;

/* ==========================================================
   BPM
========================================================== */

function getBPM() {

    let bpm =
        Number(tempoInput.value);

    if (
        !Number.isFinite(bpm)
    ) {

        bpm = 120;

    }

    bpm =
        Math.max(
            30,
            Math.min(
                300,
                bpm
            )
        );

    tempoInput.value =
        bpm;

    return bpm;

}

/* ==========================================================
   STEP DURATION
========================================================== */

function getStepDuration() {

    return (
        60 /
        getBPM()
    ) / 4;

}

/* ==========================================================
   PLAY SAMPLE
========================================================== */

function playChannelSample(
    channel,
    time
) {

    if (!channel.buffer) {
        return;
    }

    const context =
        getAudioContext();

    const source =
        context.createBufferSource();

    source.buffer =
        channel.buffer;

    source.connect(
        context.destination
    );

    source.start(time);

}

/* ==========================================================
   PLAYHEAD
========================================================== */

function updatePlayhead(step) {

    channelRack
        .querySelectorAll(".step.playing")
        .forEach(cell => {

            cell.classList.remove(
                "playing"
            );

        });

    channelRack
        .querySelectorAll(
            '.step[data-step="' +
            step +
            '"]'
        )
        .forEach(cell => {

            cell.classList.add(
                "playing"
            );

        });

}

/* ==========================================================
   SCHEDULE
========================================================== */

function scheduleStep(
    step,
    time
) {

    const pattern =
        patterns[currentPattern];

    channels.forEach(
        (channel, row) => {

            if (
                pattern[row][step]
            ) {

                playChannelSample(
                    channel,
                    time
                );

            }

        }
    );

    const delay =
        Math.max(
            0,
            (
                time -
                getAudioContext().currentTime
            ) * 1000
        );

    setTimeout(
        () => {

            if (playing) {

                updatePlayhead(step);

            }

        },
        delay
    );

}

/* ==========================================================
   SCHEDULER
========================================================== */

function scheduler() {

    if (!playing) {
        return;
    }

    const context =
        getAudioContext();

    while (
        nextStepTime <
        context.currentTime +
        SCHEDULE_AHEAD_TIME
    ) {

        /*
            If loop is OFF and we've reached
            the end of the 16-step pattern,
            stop instead of scheduling step 0.
        */

        if (
            !loopEnabled &&
            currentStep >= STEP_COUNT
        ) {

            stopSequencer();

            return;

        }

        scheduleStep(
            currentStep,
            nextStepTime
        );

        nextStepTime +=
            getStepDuration();

        currentStep++;

        /*
            Loop back to step 0 only when
            looping is enabled.
        */

        if (
            currentStep >= STEP_COUNT
        ) {

            if (loopEnabled) {

                currentStep = 0;

            }

        }

    }

}

/* ==========================================================
   START
========================================================== */

async function startSequencer() {

    const context =
        getAudioContext();

    if (
        context.state === "suspended"
    ) {

        await context.resume();

    }

    playing = true;

    currentStep = 0;

    nextStepTime =
        context.currentTime +
        0.03;

    playButton.textContent =
        "Stop";

    schedulerTimer =
        setInterval(
            scheduler,
            SCHEDULER_INTERVAL
        );

    scheduler();

}

/* ==========================================================
   STOP
========================================================== */

function stopSequencer() {

    playing = false;

    if (
        schedulerTimer !== null
    ) {

        clearInterval(
            schedulerTimer
        );

        schedulerTimer =
            null;

    }

    playButton.textContent =
        "Play";

    currentStep = 0;

    channelRack
        .querySelectorAll(
            ".step.playing"
        )
        .forEach(cell => {

            cell.classList.remove(
                "playing"
            );

        });

}

/* ==========================================================
   WAV EXPORT
========================================================== */

async function exportCurrentPatternAsAudio(
    loopSetting = "leave"
) {

    const pattern =
        patterns[currentPattern];

    const bpm =
        getBPM();

    const stepDuration =
        60 / bpm / 4;

    const barDuration =
        stepDuration * STEP_COUNT;

    const sampleRate =
        44100;

    /*
        "cut remainder" exports exactly one bar.
        "leave remainder" extends the export long enough
        for the final sample to finish naturally.
    */
    let renderDuration =
        barDuration;

    if (loopSetting === "leave") {

        for (
            let row = 0;
            row < ROW_COUNT;
            row++
        ) {

            const channel =
                channels[row];

            if (!channel.buffer) {
                continue;
            }

            for (
                let step = 0;
                step < STEP_COUNT;
                step++
            ) {

                if (!pattern[row][step]) {
                    continue;
                }

                renderDuration =
                    Math.max(
                        renderDuration,
                        step * stepDuration +
                        channel.buffer.duration
                    );

            }

        }

    }

    const renderLength =
        Math.ceil(
            renderDuration * sampleRate
        );

    const offlineContext =
        new OfflineAudioContext(
            2,
            renderLength,
            sampleRate
        );

    for (
        let step = 0;
        step < STEP_COUNT;
        step++
    ) {

        const time =
            step * stepDuration;

        for (
            let row = 0;
            row < ROW_COUNT;
            row++
        ) {

            if (
                !pattern[row][step]
            ) {
                continue;
            }

            const channel =
                channels[row];

            if (!channel.buffer) {
                continue;
            }

            const source =
                offlineContext.createBufferSource();

            source.buffer =
                channel.buffer;

            source.connect(
                offlineContext.destination
            );

            source.start(time);

        }

    }

    const rendered =
        await offlineContext.startRendering();

    const wavBlob =
        audioBufferToWav(
            rendered,
            renderLength
        );

    const url =
        URL.createObjectURL(wavBlob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        "pattern-" +
        (currentPattern + 1) +
        "-" +
        bpm +
        "bpm.wav";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        () => {

            URL.revokeObjectURL(url);

        },
        1000
    );

}

/* ==========================================================
   AUDIO BUFFER -> WAV
========================================================== */

function audioBufferToWav(
    buffer,
    frameCount
) {

    const channelCount =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const bytesPerSample =
        2;

    const blockAlign =
        channelCount *
        bytesPerSample;

    const dataSize =
        frameCount *
        blockAlign;

    const wavSize =
        44 +
        dataSize;

    const arrayBuffer =
        new ArrayBuffer(wavSize);

    const view =
        new DataView(arrayBuffer);

    let offset = 0;

    function writeString(string) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset++,
                string.charCodeAt(i)
            );

        }

    }

    function writeUint32(value) {

        view.setUint32(
            offset,
            value,
            true
        );

        offset += 4;

    }

    function writeUint16(value) {

        view.setUint16(
            offset,
            value,
            true
        );

        offset += 2;

    }

    writeString("RIFF");
    writeUint32(36 + dataSize);
    writeString("WAVE");

    writeString("fmt ");
    writeUint32(16);
    writeUint16(1);
    writeUint16(channelCount);
    writeUint32(sampleRate);
    writeUint32(sampleRate * blockAlign);
    writeUint16(blockAlign);
    writeUint16(16);

    writeString("data");
    writeUint32(dataSize);

    const channelData = [];

    for (
        let channel = 0;
        channel < channelCount;
        channel++
    ) {

        channelData.push(
            buffer.getChannelData(channel)
        );

    }

    for (
        let frame = 0;
        frame < frameCount;
        frame++
    ) {

        for (
            let channel = 0;
            channel < channelCount;
            channel++
        ) {

            let sample =
                channelData[channel][frame];

            if (
                !Number.isFinite(sample)
            ) {

                sample = 0;

            }

            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

            const value =
                sample < 0
                    ? sample * 32768
                    : sample * 32767;

            view.setInt16(
                offset,
                value,
                true
            );

            offset += 2;

        }

    }

    return new Blob(
        [arrayBuffer],
        {
            type: "audio/wav"
        }
    );

}
