<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rack</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #242424;
    position: relative;
}

/* ==========================================================
   WINDOWS
========================================================== */

.window {
    position: absolute;
    background: #aaa;
    border: 2px solid #151515;

    box-shadow:
        6px 6px 0 rgba(0,0,0,0.35),
        inset 1px 1px 0 rgba(255,255,255,0.25);

    overflow: hidden;
}

#rack {
    left: 50%;
    top: 50%;
    width: 700px;
    height: 480px;
    transform: translate(-50%, -50%);
}

#browser {
    left: 80px;
    top: 80px;
    width: 330px;
    height: 430px;
    z-index: 1;
}

#playlist {
    left: 50%;
    top: 50%;
    width: 760px;
    height: 500px;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 25;
}

/* ==========================================================
   TITLEBAR
========================================================== */

.titlebar {
    position: absolute;
    left: -2px;
    top: -2px;
    width: calc(100% + 4px);
    height: 30px;

    display: flex;
    align-items: center;

    background: #3c3c3c;

    border: 2px solid #151515;
    border-bottom: 2px solid #202020;

    color: #eee;

    font-size: 13px;
    font-weight: bold;

    cursor: move;
    z-index: 10;
}

.title {
    flex: 1;
    padding-left: 9px;
    pointer-events: none;
}

/* ==========================================================
   TOPBAR MENU BUTTONS
========================================================== */

.menu-area {
    height: 100%;
    display: flex;
    align-items: stretch;
}

.menu-button {
    width: 52px;
    height: 100%;

    border: 0;
    border-left: 1px solid #202020;

    background: #454545;
    color: #ddd;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.menu-button:hover {
    background: #5b5b5b;
}

.menu-button:active,
.menu-button.open {
    background: #303030;
}

/* ==========================================================
   DROPDOWN MENUS
========================================================== */

.dropdown {
    position: absolute;
    top: 28px;

    min-width: 190px;

    background: #d0d0d0;

    border: 2px solid #222;

    box-shadow:
        4px 4px 0 rgba(0,0,0,0.35);

    display: none;

    z-index: 100;
}

.dropdown.open {
    display: block;
}

.dropdown-item {
    height: 30px;

    display: flex;
    align-items: center;

    padding: 0 10px;

    color: #222;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.dropdown-item:hover {
    background: #e0b82f;
}

/* ==========================================================
   WINDOW BUTTON
========================================================== */

.window-button {
    width: 32px;
    height: 100%;

    border: 0;
    border-left: 1px solid #202020;

    background: #505050;
    color: #ddd;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.window-button:hover {
    background: #666;
}

.window-button:active {
    background: #333;
}

/* ==========================================================
   RACK CONTENT
========================================================== */

.content {
    position: absolute;

    left: 0;
    top: 30px;

    width: 100%;
    height: calc(100% - 30px);

    padding: 8px;

    background: #171717;
}

/* ==========================================================
   PATTERN AREA
========================================================== */

.pattern-area {
    height: 112px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    padding: 8px;

    margin-bottom: 7px;
}

.pattern-control {
    height: 94px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

.pattern-title {
    width: 90px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ddd;

    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.pattern-selector {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.pattern-number {
    width: 90px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #777;
    background: #d0d0d0;
    color: #222;

    font-size: 26px;
    font-weight: bold;
    user-select: none;
}

.pattern-arrow-buttons {
    width: 34px;
    height: 52px;

    display: flex;
    flex-direction: column;
    gap: 2px;
}

.pattern-arrow {
    flex: 1;
    padding: 0;

    border: 2px solid #777;
    background: #bdbdbd;
    color: #222;

    font-size: 12px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
}

.pattern-arrow:hover {
    background: #d0d0d0;
}

.pattern-arrow:active {
    background: #999;
}

.tempo-control {
    height: 94px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

.tempo-title {
    width: 90px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ddd;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.tempo-selector {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.tempo-number {
    width: 90px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #777;
    background: #d0d0d0;
    color: #222;

    font-size: 26px;
    font-weight: bold;
    user-select: none;
}

.tempo-arrow-buttons {
    width: 34px;
    height: 52px;

    display: flex;
    flex-direction: column;
    gap: 2px;
}

.tempo-arrow {
    flex: 1;
    padding: 0;

    border: 2px solid #777;
    background: #bdbdbd;
    color: #222;

    font-size: 12px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
}

.tempo-arrow:hover {
    background: #d0d0d0;
}

.tempo-arrow:active {
    background: #999;
}

/* ==========================================================
   CONTROLS
========================================================== */

.controls {
    height: 38px;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 4px 5px;

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.15);

    margin-bottom: 7px;
}

.play-button,
.playlist-button {
    height: 26px;

    border: 2px solid #292929;

    background: #555;
    color: #eee;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.play-button {
    width: 58px;
}

.playlist-button {
    width: 112px;
}

.metronome-button {
    width: 88px;
    height: 26px;
    border: 2px solid #292929;
    background: #555;
    color: #eee;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.metronome-button:hover {
    background: #666;
}

.metronome-button:active {
    background: #3b3b3b;
}

.metronome-button.enabled {
    background: #e0b82f;
    border-color: #9b7b15;
    color: #222;
}

.play-button:hover,
.playlist-button:hover {
    background: #666;
}

.play-button:active,
.playlist-button:active {
    background: #3b3b3b;
}

.playlist-button.enabled {
    background: #e0b82f;
    border-color: #9b7b15;
    color: #222;
}

.tempo-label {
    color: #ddd;

    font-size: 12px;
    font-weight: bold;

    margin-left: 3px;
}

.tempo-input {
    width: 58px;
    height: 26px;

    border: 2px solid #444;

    background: #d0d0d0;
    color: #222;

    font-size: 12px;
    font-weight: bold;

    padding: 2px 5px;

    outline: none;
}

.tempo-input:focus {
    background: #e2e2e2;
}

/* ==========================================================
   CHANNEL RACK
========================================================== */

.channel-rack {
    width: 100%;
    height: calc(100% - 164px);

    background: #858585;

    border: 2px solid #666;
    border-top-color: #bdbdbd;
    border-left-color: #bdbdbd;

    padding: 7px;

    overflow: hidden;
}

/* ==========================================================
   CHANNEL ROW
========================================================== */

.channel-row {
    height: 58px;

    display: flex;
    align-items: center;

    margin-bottom: 6px;
}

.channel-row:last-child {
    margin-bottom: 0;
}

/* ==========================================================
   SAMPLE BOX
========================================================== */

.sample-box {
    flex-shrink: 0;

    width: 115px;
    height: 52px;

    background: #555;

    border: 2px solid #303030;
    border-top-color: #707070;
    border-left-color: #707070;

    color: #ddd;

    display: flex;
    align-items: center;

    padding: 0 8px;

    overflow: hidden;
}

.sample-box:hover {
    background: #606060;
}

.sample-box.drag-over {
    background: #777;
    border-color: #e0b82f;
}

.sample-name {
    width: 100%;

    font-size: 11px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    pointer-events: none;
}

/* ==========================================================
   STEP AREA
========================================================== */

.steps {
    height: 52px;

    flex: 1;

    display: grid;

    grid-template-columns: repeat(16, 1fr);

    gap: 3px;

    margin-left: 7px;
}

/* ==========================================================
   STEP
========================================================== */

.step {
    min-width: 0;

    border: 2px solid #292929;

    cursor: pointer;

    transition:
        background 0.04s linear,
        filter 0.04s linear;
}

.step.group-blue {
    background: #41647d;
}

.step.group-red {
    background: #765050;
}

.step.active.group-blue {
    background: #79a9c7;
    border-color: #a9cbe0;
}

.step.active.group-red {
    background: #c88484;
    border-color: #e0abab;
}

.step:hover {
    filter: brightness(1.15);
}

.step.active:hover {
    filter: brightness(1.08);
}

.step.playing {
    filter: brightness(1.45);
}

.step.active.playing {
    filter: brightness(1.2);
}

.step.group-start {
    margin-left: 3px;
}

/* ==========================================================
   PLAYLIST
========================================================== */

.playlist-content {
    position: absolute;
    left: 0;
    top: 30px;
    width: 100%;
    height: calc(100% - 30px);
    padding: 8px;
    background: #111;
    overflow: hidden;
}

.playlist-scroll {
    width: 100%;
    height: 100%;
    overflow: scroll;
    background: #0a0a0a;
    border: 2px solid #292929;
    scroll-snap-type: none;
    overscroll-behavior: contain;
}

.playlist-grid {
    display: grid;
    grid-template-columns: 62px repeat(var(--playlist-columns), 64px);
    grid-template-rows: repeat(50, 32px);
    gap: 2px;
    width: max-content;
    min-height: 100%;
    padding: 2px;
}

.playlist-label {
    position: sticky;
    left: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202a31;
    color: #d8e3ea;
    border: 1px solid #394952;
    font-size: 11px;
    font-weight: bold;
}

.playlist-cell {
    width: 64px;
    height: 32px;
    background: #48677b;
    border: 1px solid #304957;
    cursor: pointer;
}

.playlist-cell:hover {
    background: #5d8097;
}

.playlist-cell.active {
    background: #83aeca;
    border-color: #a9cbe0;
}

.playlist-cell.playing {
    filter: brightness(1.35);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
}

.playlist-cell.active.playing {
    background: #a8cce3;
}

.playlist-scroll::-webkit-scrollbar {
    width: 14px;
    height: 14px;
}

.playlist-scroll::-webkit-scrollbar-track {
    background: #111;
}

.playlist-scroll::-webkit-scrollbar-thumb {
    background: #3c4d57;
    border: 3px solid #111;
}

.playlist-scroll::-webkit-scrollbar-thumb:hover {
    background: #516976;
}

/* ==========================================================
   PLAYLIST PLAYHEAD
========================================================== */

.playlist-status {
    position: absolute;
    left: 10px;
    top: 7px;
    z-index: 8;
    padding: 3px 6px;
    background: #151515;
    color: #aebec7;
    border: 1px solid #303c43;
    font-size: 10px;
    font-weight: bold;
    pointer-events: none;
}

/* ==========================================================
   EXPORT SETTINGS
========================================================== */

#exportSettings {
    left: 50%;
    top: 50%;
    width: 330px;
    height: 220px;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 20;
}

#exportSettings.open {
    display: block;
}

.export-settings-content {
    position: absolute;
    left: 0;
    top: 30px;
    width: 100%;
    height: calc(100% - 30px);
    padding: 12px;
    background: #aaa;
}

.export-setting-label {
    display: block;
    margin-bottom: 6px;
    color: #222;
    font-size: 12px;
    font-weight: bold;
}

.export-setting-select {
    width: 100%;
    height: 30px;
    border: 2px solid #444;
    background: #d0d0d0;
    color: #222;
    font-size: 12px;
    font-weight: bold;
    padding: 2px 5px;
    outline: none;
}

.export-setting-select:focus {
    background: #e2e2e2;
}

.export-button {
    position: absolute;
    left: 12px;
    bottom: 12px;
    width: calc(100% - 24px);
    height: 32px;
    border: 2px solid #292929;
    background: #555;
    color: #eee;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.export-button:hover {
    background: #666;
}

.export-button:active {
    background: #3b3b3b;
}


/* ==========================================================
   SAMPLER
========================================================== */

#sampler {
    left: 50%;
    top: 50%;
    width: 620px;
    height: 360px;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 30;
}

#sampler.open {
    display: block;
}

.sampler-content {
    position: absolute;
    left: 0;
    top: 30px;
    width: 100%;
    height: calc(100% - 30px);
    padding: 10px;
    background: #151515;
}

.sampler-controls {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 18px;
    background: #0b0b0b;
    border: 2px solid #292929;
    padding: 7px 10px;
}

.pitch-control {
    height: 54px;
    width: 250px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.pitch-slider {
    appearance: slider-vertical;
    -webkit-appearance: slider-vertical;
    width: 24px;
    height: 52px;
    accent-color: #e0b82f;
    cursor: ns-resize;
}

.pitch-readout {
    width: 120px;
    color: #ddd;
    font-size: 12px;
    font-weight: bold;
    line-height: 18px;
}

.sampler-check {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ddd;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.sampler-check input {
    width: 16px;
    height: 16px;
    accent-color: #e0b82f;
    cursor: pointer;
}

.waveform-wrap {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    top: 92px;
    background: #050505;
    border: 2px solid #292929;
    overflow: hidden;
}

#waveformCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* ==========================================================
   PITCH CONTEXT MENU
========================================================== */

.pitch-context-menu {
    position: fixed;
    min-width: 150px;
    background: #d0d0d0;
    border: 2px solid #222;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    display: none;
    z-index: 1000;
}

.pitch-context-menu.open {
    display: block;
}

.pitch-context-item {
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    color: #222;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.pitch-context-item:hover {
    background: #e0b82f;
}

/* ==========================================================
   MINIMIZED
========================================================== */

.window.minimized {
    height: 30px !important;
    min-height: 30px !important;
    max-height: 30px !important;
}

.window.minimized .titlebar {
    display: flex !important;
    height: 30px !important;
    min-height: 30px !important;
    max-height: 30px !important;
}

.window.minimized .content,
.window.minimized .browser-content,
.window.minimized .playlist-content {
    display: none !important;
}

.window.minimized > :not(.titlebar) {
    display: none !important;
}

/* ==========================================================
   DRAGGING
========================================================== */

.window.dragging {
    box-shadow:
        8px 8px 0 rgba(0,0,0,0.4),
        inset 1px 1px 0 rgba(255,255,255,0.25);
}

/* ==========================================================
   BROWSER
========================================================== */

.browser-content {
    position: absolute;

    left: 0;
    top: 30px;

    width: 100%;
    height: calc(100% - 30px);

    padding: 7px;

    background: #080808;

    overflow: hidden;
}

.tree {
    width: 100%;
    height: 100%;

    background: #0d0d0d;

    border: 2px solid #666;
    border-top-color: #444;
    border-left-color: #444;

    padding: 6px;

    overflow: auto;

    color: #ddd;

    font-size: 12px;
}

.tree-row {
    min-height: 22px;

    display: flex;
    align-items: center;

    white-space: nowrap;

    padding-right: 4px;
}

.tree-folder {
    font-weight: bold;
}

.tree-file {
    cursor: grab;

    border: 1px solid transparent;
}

.tree-file:hover {
    background: #1a1a1a;
    border-color: #333;
}

.tree-file:active {
    cursor: grabbing;
    background: #171717;
}

.folder-icon {
    width: 18px;
    display: inline-block;
}

.file-icon {
    width: 18px;
    display: inline-block;
}

.file-name {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tree-message {
    color: #777;
    padding: 5px;
    font-size: 11px;
}
</style>

</head>

<body>

<!-- ==========================================================
     RACK
========================================================== -->

<div class="window" id="rack">

<div class="titlebar" id="rackTitlebar">

    <div class="title">
        rack
    </div>

    <div class="menu-area">

        <button
            class="menu-button"
            id="fileButton"
        >
            File
        </button>

        <button
            class="menu-button"
            id="editButton"
        >
            Edit
        </button>

        <button
            class="menu-button"
            id="viewButton"
        >
            View
        </button>

    </div>

    <button
        class="window-button"
        id="toggleRack"
    >
        _
    </button>

    <div
        class="dropdown"
        id="fileMenu"
        style="right: 136px;"
    >
        <div
            class="dropdown-item"
            id="newProject"
        >
            New
        </div>

        <div
            class="dropdown-item"
            id="exportAudio"
        >
            Export pattern as audio
        </div>
    </div>

    <div
        class="dropdown"
        id="viewMenu"
        style="right: 32px;"
    >
        <div
            class="dropdown-item"
            id="playlistView"
        >
            <span id="playlistViewCheck" style="display:none; width:16px;">✓</span><span>Playlist</span>
        </div>
    </div>

    <div
        class="dropdown"
        id="editMenu"
        style="right: 84px;"
    >
        <div
            class="dropdown-item"
            id="copyPattern"
        >
            Copy
        </div>

        <div
            class="dropdown-item"
            id="pastePattern"
        >
            Paste
        </div>
    </div>

</div>

<div class="content">

    <div class="pattern-area">

        <div class="pattern-control">
            <div class="pattern-title">
                pattern
            </div>

            <div class="pattern-selector">
                <div class="pattern-number" id="patternNumber">1</div>

                <div class="pattern-arrow-buttons">
                    <button
                        type="button"
                        class="pattern-arrow"
                        id="patternUp"
                        aria-label="Next pattern"
                    >▲</button>

                    <button
                        type="button"
                        class="pattern-arrow"
                        id="patternDown"
                        aria-label="Previous pattern"
                    >▼</button>
                </div>
            </div>
        </div>

        <div class="tempo-control">
            <div class="tempo-title">
                tempo
            </div>

            <div class="tempo-selector">
                <div class="tempo-number" id="tempoNumber">120</div>

                <div class="tempo-arrow-buttons">
                    <button
                        type="button"
                        class="tempo-arrow"
                        id="tempoUp"
                        aria-label="Increase tempo"
                    >▲</button>

                    <button
                        type="button"
                        class="tempo-arrow"
                        id="tempoDown"
                        aria-label="Decrease tempo"
                    >▼</button>
                </div>
            </div>
        </div>

    </div>

    <div class="controls">

        <button
            class="play-button"
            id="playButton"
        >
            Play
        </button>

        <button
            class="playlist-button"
            id="playlistButton"
        >
            Play in playlist
        </button>

        <button
            class="metronome-button"

<script>

/* ==========================================================
   WINDOW MANAGER
========================================================== */

let highestZIndex = 10;

function bringToFront(windowElement) {

    highestZIndex++;

    windowElement.style.zIndex =
        highestZIndex;
}

document.querySelectorAll(".window").forEach(
    windowElement => {

        windowElement.addEventListener(
            "pointerdown",
            () => {

                bringToFront(windowElement);

            },
            true
        );

    }
);

/* ==========================================================
   WINDOW DRAGGING
========================================================== */

function setupWindowDrag(
    windowElement,
    titlebar,
    toggleButton
) {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    let minimized = false;

    if (toggleButton) {
        toggleButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                bringToFront(windowElement);

                const rect =
                    windowElement.getBoundingClientRect();

                windowElement.style.transform =
                    "none";

                windowElement.style.left =
                    rect.left + "px";

                windowElement.style.top =
                    rect.top + "px";

                minimized =
                    !minimized;

                windowElement.classList.toggle(
                    "minimized",
                    minimized
                );

                toggleButton.textContent =
                    minimized
                        ? "□"
                        : "_";

            }
        );
    }

    titlebar.addEventListener(
        "mousedown",
        event => {

            if (
                event.target.closest("button") ||
                event.target.closest(".dropdown")
            ) {
                return;
            }

            bringToFront(windowElement);

            dragging = true;

            windowElement.classList.add(
                "dragging"
            );

            const rect =
                windowElement.getBoundingClientRect();

            windowElement.style.transform =
                "none";

            windowElement.style.left =
                rect.left + "px";

            windowElement.style.top =
                rect.top + "px";

            offsetX =
                event.clientX -
                rect.left;

            offsetY =
                event.clientY -
                rect.top;

            event.preventDefault();

        }
    );

    document.addEventListener(
        "mousemove",
        event => {

            if (!dragging) {
                return;
            }

            const rect =
                windowElement.getBoundingClientRect();

            const maxLeft =
                Math.max(
                    0,
                    window.innerWidth -
                    rect.width
                );

            const maxTop =
                Math.max(
                    0,
                    window.innerHeight -
                    rect.height
                );

            const left =
                event.clientX -
                offsetX;

            const top =
                event.clientY -
                offsetY;

            windowElement.style.left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        maxLeft
                    )
                ) + "px";

            windowElement.style.top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        maxTop
                    )
                ) + "px";

        }
    );

    document.addEventListener(
        "mouseup",
        () => {

            if (!dragging) {
                return;
            }

            dragging = false;

            windowElement.classList.remove(
                "dragging"
            );

        }
    );

}

/* ==========================================================
   WINDOW SETUP
========================================================== */

const rackWindow =
    document.getElementById("rack");

const browserWindow =
    document.getElementById("browser");

setupWindowDrag(
    rackWindow,
    document.getElementById("rackTitlebar"),
    document.getElementById("toggleRack")
);

setupWindowDrag(
    browserWindow,
    document.getElementById("browserTitlebar"),
    document.getElementById("toggleBrowser")
);

const playlistWindow =
    document.getElementById("playlist");

setupWindowDrag(
    playlistWindow,
    document.getElementById("playlistTitlebar"),
    document.getElementById("togglePlaylist")
);

const exportSettingsWindow =
    document.getElementById("exportSettings");

setupWindowDrag(
    exportSettingsWindow,
    document.getElementById("exportSettingsTitlebar"),
    null
);

document.getElementById("closeExportSettings").addEventListener("click", event => {
    event.stopPropagation();
    exportSettingsWindow.classList.remove("open");
});

const samplerWindow =
    document.getElementById("sampler");

setupWindowDrag(
    samplerWindow,
    document.getElementById("samplerTitlebar"),
    null
);

/* ==========================================================
   PATTERN SYSTEM
========================================================== */

const PATTERN_COUNT = 50;
const ROW_COUNT = 4;
const STEP_COUNT = 16;

let currentPattern = 0;

const patterns = [];

for (
    let pattern = 0;
    pattern < PATTERN_COUNT;
    pattern++
) {

    const patternChannels = [];

    for (
        let channel = 0;
        channel < ROW_COUNT;
        channel++
    ) {

        patternChannels.push(
            new Array(STEP_COUNT).fill(false)
        );

    }

    patterns.push(patternChannels);

}

/* ==========================================================
   PLAYLIST DATA
========================================================== */

const PLAYLIST_INITIAL_COLUMNS = 32;
const PLAYLIST_COLUMN_CHUNK = 16;
let playlistColumnCount = PLAYLIST_INITIAL_COLUMNS;

const playlistRows = Array.from(
    { length: PATTERN_COUNT },
    () => new Set()
);

const playlistGrid =
    document.getElementById("playlistGrid");

const playlistScroll =
    document.getElementById("playlistScroll");

const playlistStatus =
    document.getElementById("playlistStatus");

function renderPlaylistColumns() {
    const savedScrollLeft = playlistScroll.scrollLeft;
    const savedScrollTop = playlistScroll.scrollTop;

    playlistGrid.style.setProperty(
        "--playlist-columns",
        playlistColumnCount
    );

    playlistGrid.innerHTML = "";

    for (let pattern = 0; pattern < PATTERN_COUNT; pattern++) {
        const label = document.createElement("div");
        label.className = "playlist-label";
        label.textContent = "Pattern " + (pattern + 1);
        label.dataset.pattern = pattern;
        playlistGrid.appendChild(label);

        for (let column = 0; column < playlistColumnCount; column++) {
            const cell = document.createElement("div");
            cell.className = "playlist-cell";
            cell.dataset.pattern = pattern;
            cell.dataset.column = column;

            if (playlistRows[pattern].has(column)) {
                cell.classList.add("active");
            }

            playlistGrid.appendChild(cell);
        }
    }

    requestAnimationFrame(() => {
        playlistScroll.scrollLeft = Math.max(0, savedScrollLeft);
        playlistScroll.scrollTop = Math.max(0, savedScrollTop);
    });
}

function setPlaylistCell(pattern, column, enabled) {
    if (
        pattern < 0 ||
        pattern >= PATTERN_COUNT ||
        column < 0
    ) {
        return;
    }

    if (enabled) {
        playlistRows[pattern].add(column);
    } else {
        playlistRows[pattern].delete(column);
    }

    const cell = playlistGrid.querySelector(
        '.playlist-cell[data-pattern="' + pattern +
        '"][data-column="' + column + '"]'
    );

    if (cell) {
        cell.classList.toggle("active", enabled);
    }
}

function getPlaylistLength() {
    let lastColumn = -1;

    playlistRows.forEach(row => {
        row.forEach(column => {
            if (column > lastColumn) {
                lastColumn = column;
            }
        });
    });

    return Math.max(1, lastColumn + 1);
}

function clearPlaylist() {
    playlistRows.forEach(row => row.clear());
    renderPlaylistColumns();
}

function ensurePlaylistColumns(column) {
    if (column < playlistColumnCount - 8) {
        return;
    }

    playlistColumnCount += PLAYLIST_COLUMN_CHUNK;
    renderPlaylistColumns();
}

let playlistPaintMode = null;
let playlistPainting = false;
let lastPaintedPlaylistCell = "";

playlistGrid.addEventListener("pointerdown", event => {
    const cell = event.target.closest(".playlist-cell");
    if (!cell) return;

    event.preventDefault();

    const pattern = Number(cell.dataset.pattern);
    const column = Number(cell.dataset.column);

    playlistPaintMode =
        cell.classList.contains("active")
            ? "erase"
            : "paint";

    playlistPainting = true;
    lastPaintedPlaylistCell = "";

    setPlaylistCell(
        pattern,
        column,
        playlistPaintMode === "paint"
    );

    if (playlistPaintMode === "paint") {
        ensurePlaylistColumns(column);
    }

    lastPaintedPlaylistCell =
        pattern + ":" + column;

    cell.setPointerCapture?.(event.pointerId);
});

playlistGrid.addEventListener("pointerover", event => {
    if (!playlistPainting || !playlistPaintMode) {
        return;
    }

    const cell = event.target.closest(".playlist-cell");
    if (!cell) return;

    const pattern = Number(cell.dataset.pattern);
    const column = Number(cell.dataset.column);
    const key = pattern + ":" + column;

    if (key === lastPaintedPlaylistCell) {
        return;
    }

    setPlaylistCell(
        pattern,
        column,
        playlistPaintMode === "paint"
    );

    if (playlistPaintMode === "paint") {
        ensurePlaylistColumns(column);
    }

    lastPaintedPlaylistCell = key;
});

window.addEventListener("pointerup", () => {
    playlistPainting = false;
    playlistPaintMode = null;
    lastPaintedPlaylistCell = "";
});

playlistGrid.addEventListener("contextmenu", event => {
    const cell = event.target.closest(".playlist-cell");
    if (!cell) return;

    event.preventDefault();

    const pattern = Number(cell.dataset.pattern);
    const column = Number(cell.dataset.column);

    setPlaylistCell(pattern, column, false);
});

playlistScroll.addEventListener("scroll", () => {
    if (playlistScroll.scrollLeft < 0) {
        playlistScroll.scrollLeft = 0;
    }

    if (playlistScroll.scrollTop < 0) {
        playlistScroll.scrollTop = 0;
    }

    if (
        playlistScroll.scrollLeft +
        playlistScroll.clientWidth >=
        playlistScroll.scrollWidth - 160
    ) {
        playlistColumnCount += PLAYLIST_COLUMN_CHUNK;
        renderPlaylistColumns();
    }
});

renderPlaylistColumns();
playlistScroll.scrollLeft = 0;
playlistScroll.scrollTop = 0;

/* ==========================================================
   PATTERN SELECTOR
========================================================== */

const patternNumber =
    document.getElementById("patternNumber");

const patternUp =
    document.getElementById("patternUp");

const patternDown =
    document.getElementById("patternDown");

function clampPatternNumber(value) {

    value = Number(value);

    if (!Number.isFinite(value)) {
        value = currentPattern + 1;
    }

    value = Math.round(value);

    return Math.max(
        1,
        Math.min(
            PATTERN_COUNT,
            value
        )
    );

}

function updatePatternNumber() {

    patternNumber.textContent =
        currentPattern + 1;

}

function switchPattern(pattern) {

    pattern = clampPatternNumber(
        pattern + 1
    ) - 1;

    currentPattern =
        pattern;

    updatePatternNumber();

    renderCurrentPattern();

}

function changePatternBy(amount) {

    const next =
        clampPatternNumber(
            currentPattern + 1 + amount
        );

    currentPattern =
        next - 1;

    updatePatternNumber();

    renderCurrentPattern();

}

patternUp.addEventListener(
    "click",
    () => {
        changePatternBy(1);
    }
);

patternDown.addEventListener(
    "click",
    () => {
        changePatternBy(-1);
    }
);

/* ==========================================================
   CHANNELS
========================================================== */

const channelRack =
    document.getElementById("channelRack");

const channels = [];

for (
    let row = 0;
    row < ROW_COUNT;
    row++
) {

    channels.push({

        name:
            "Sample " +
            (row + 1),

        buffer:
            null,
        pitchCents:
            0,
        cutSelf:
            false,
        reverse:
            false

    });

    const rowElement =
        document.createElement("div");

    rowElement.className =
        "channel-row";

    const sampleBox =
        document.createElement("div");

    sampleBox.className =
        "sample-box";

    const sampleName =
        document.createElement("div");

    sampleName.className =
        "sample-name";

    sampleName.textContent =
        "Sample " +
        (row + 1);

    sampleBox.appendChild(
        sampleName
    );

    sampleBox.addEventListener(
        "dragover",
        event => {

            if (
                event.dataTransfer.types.includes(
                    "application/x-rack-audio"
                )
            ) {

                event.preventDefault();

                event.dataTransfer.dropEffect =
                    "copy";

                sampleBox.classList.add(
                    "drag-over"
                );

            }

        }
    );

    sampleBox.addEventListener(
        "dragleave",
        () => {

            sampleBox.classList.remove(
                "drag-over"
            );

        }
    );

    sampleBox.addEventListener(
        "drop",
        async event => {

            event.preventDefault();

            sampleBox.classList.remove(
                "drag-over"
            );

            const url =
                event.dataTransfer.getData(
                    "application/x-rack-audio"
                );

            const filename =
                event.dataTransfer.getData(
                    "application/x-rack-name"
                );

            if (!url) {
                return;
            }

            await loadSampleIntoChannel(
                row,
                url,
                filename
            );

        }
    );

    sampleBox.addEventListener("dblclick", event => {
        event.stopPropagation();
        openSamplerForChannel(row);
    });

    rowElement.appendChild(
        sampleBox
    );

    /* ======================================================
       STEPS
    ====================================================== */

    const steps =
        document.createElement("div");

    steps.className =
        "steps";

    for (
        let step = 0;
        step < STEP_COUNT;
        step++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "step " +
            (
                Math.floor(step / 4) % 2 === 0
                    ? "group-blue"
                    : "group-red"
            );

        if (
            step === 4 ||
            step === 8 ||
            step === 12
        ) {

            cell.classList.add(
                "group-start"
            );

        }

        cell.dataset.row =
            row;

        cell.dataset.step =
            step;

        /*
            LEFT CLICK = ADD

            It can never turn an active step
            back off.
        */

        cell.addEventListener(
            "click",
            event => {

                event.preventDefault();

                patterns[currentPattern][row][step] =
                    true;

                cell.classList.add(
                    "active"
                );

            }
        );

        /*
            RIGHT CLICK = REMOVE
        */

        cell.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                patterns[currentPattern][row][step] =
                    false;

                cell.classList.remove(
                    "active"
                );

            }
        );

        steps.appendChild(cell);

    }

    rowElement.appendChild(
        steps
    );

    channelRack.appendChild(
        rowElement
    );

}

/* ==========================================================
   PATTERN RENDER
========================================================== */

function updateStepVisual(
    row,
    step
) {

    const cell =
        channelRack.querySelector(
            '.step[data-row="' +
            row +
            '"][data-step="' +
            step +
            '"]'
        );

    if (!cell) {
        return;
    }

    cell.classList.toggle(
        "active",
        patterns[currentPattern][row][step]
    );

}

function renderCurrentPattern() {

    for (
        let row = 0;
        row < ROW_COUNT;
        row++
    ) {

        for (
            let step = 0;
            step < STEP_COUNT;
            step++
        ) {

            updateStepVisual(
                row,
                step
            );

        }

    }

}

/* ==========================================================
   AUDIO
========================================================== */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioContext({
                latencyHint:
                    "interactive"
            });

    }

    return audioContext;

}

/* ==========================================================
   LOAD SAMPLE
========================================================== */

async function loadSampleIntoChannel(
    channelIndex,
    url,
    filename
) {

    const channel =
        channels[channelIndex];

    const context =
        getAudioContext();

    try {

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Could not load " + url
            );

        }

        const arrayBuffer =
            await response.arrayBuffer();

        const decoded =
            await context.decodeAudioData(
                arrayBuffer
            );

        channel.buffer =
            decoded;

        channel.name =
            filename;
        channel.pitchCents =
            0;
        channel.cutSelf =
            false;
        channel.reverse =
            false;

        const rowElement =
            channelRack.children[
                channelIndex
            ];

        rowElement.querySelector(
            ".sample-name"
        ).textContent =
            filename;

    } catch (error) {

        console.error(
            "Could not load sample:",
            error
        );

    }

}

/* ==========================================================
   GITHUB DRUM SAMPLE CONFIG
========================================================== */

const GITHUB_API_URL =
    "https://api.github.com/repos/mrfranco27/spark/contents/drum_samples";

/* ==========================================================
   AUDIO CHECK
========================================================== */

function isAudioFile(filename) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    return [
        "wav",
        "mp3",
        "ogg",
        "m4a",
        "aac",
        "flac",
        "webm"
    ].includes(extension);

}

/* ==========================================================
   LOAD GITHUB FOLDER
========================================================== */

async function loadGitHubFolder(
    apiURL,
    parentElement,
    depth
) {

    const response =
        await fetch(apiURL);

    if (!response.ok) {

        throw new Error(
            "GitHub API request failed: " +
            response.status
        );

    }

    const entries =
        await response.json();

    entries.sort(
        (a, b) => {

            if (
                a.type !== b.type
            ) {

                return a.type === "dir"
                    ? -1
                    : 1;

            }

            return a.name.localeCompare(
                b.name
            );

        }
    );

    for (
        const entry of entries
    ) {

        if (
            entry.type === "dir"
        ) {

            createGitHubFolderRow(
                entry.name,
                parentElement,
                depth
            );

            await loadGitHubFolder(
                entry.url,
                parentElement,
                depth + 1
            );

        } else if (
            entry.type === "file" &&
            isAudioFile(entry.name)
        ) {

            createGitHubFileRow(
                entry.name,
                entry.download_url,
                parentElement,
                depth
            );

        }

    }

}

/* ==========================================================
   GITHUB FOLDER ROW
========================================================== */

function createGitHubFolderRow(
    name,
    parentElement,
    depth
) {

    const row =
        document.createElement("div");

    row.className =
        "tree-row tree-folder";

    row.style.paddingLeft =
        (depth * 15) + "px";

    const icon =
        document.createElement("span");

    icon.className =
        "folder-icon";

    icon.textContent =
        "📁";

    const text =
        document.createElement("span");

    text.textContent =
        name;

    row.appendChild(icon);
    row.appendChild(text);

    parentElement.appendChild(row);

}

/* ==========================================================
   GITHUB AUDIO FILE ROW
========================================================== */

function createGitHubFileRow(
    name,
    url,
    parentElement,
    depth
) {

    const row =
        document.createElement("div");

    row.className =
        "tree-row tree-file";

    row.draggable =
        true;

    row.style.paddingLeft =
        (depth * 15) + "px";

    const icon =
        document.createElement("span");

    icon.className =
        "file-icon";

    icon.textContent =
        "♪";

    const text =
        document.createElement("span");

    text.className =
        "file-name";

    text.textContent =
        name;

    row.appendChild(icon);
    row.appendChild(text);

    row.addEventListener(
        "click",
        async event => {
            event.stopPropagation();
            try {
                const context = getAudioContext();
                if (context.state === "suspended") {
                    await context.resume();
                }

                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                const decoded = await context.decodeAudioData(arrayBuffer);

                const source = context.createBufferSource();
                source.buffer = decoded;
                source.connect(context.destination);
                source.start();
            } catch (error) {
                console.error("Could not preview sample:", error);
            }
        }
    );

    row.addEventListener(
        "dragstart",
        event => {

            event.dataTransfer.setData(
                "application/x-rack-audio",
                url
            );

            event.dataTransfer.setData(
                "application/x-rack-name",
                name
            );

            event.dataTransfer.effectAllowed =
                "copy";

            bringToFront(
                browserWindow
            );

        }
    );

    parentElement.appendChild(row);

}

/* ==========================================================
   LOAD DRUM SAMPLES
========================================================== */

const tree =
    document.getElementById("tree");

async function loadDrumSamples() {

    tree.innerHTML = "";

    const root =
        document.createElement("div");

    root.className =
        "tree-row tree-folder";

    root.innerHTML =
        '<span class="folder-icon">📁</span>' +
        "drum_samples";

    tree.appendChild(root);

    try {

        await loadGitHubFolder(
            GITHUB_API_URL,
            tree,
            1
        );

    } catch (error) {

        console.error(
            "Could not read GitHub drum_samples:",
            error
        );

        tree.innerHTML = "";

        const message =
            document.createElement("div");

        message.className =
            "tree-message";

        message.textContent =
            "Could not read GitHub drum_samples.";

        tree.appendChild(message);

    }

}

loadDrumSamples();

/* ==========================================================
   SAMPLER
========================================================== */

const samplerTitle =
    document.getElementById("samplerTitle");
const pitchSlider =
    document.getElementById("pitchSlider");
const pitchReadout =
    document.getElementById("pitchReadout");
const cutSelf =
    document.getElementById("cutSelf");
const reverseSample =
    document.getElementById("reverseSample");
const waveformCanvas =
    document.getElementById("waveformCanvas");

function formatPitch(cents) {
    const sign = cents > 0 ? "+" : "";
    const semitones = cents / 100;
    return "Pitch: " + sign + cents + " cents<br>" +
        sign + semitones.toFixed(2) + " semitones";
}

function drawWaveform(buffer) {
    const canvas = waveformCanvas;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));

    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const width = rect.width;
    const height = rect.height;

    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, height / 2);
    ctx.lineTo(width, height / 2);
    ctx.stroke();

    if (!buffer) return;

    const channels = buffer.numberOfChannels;
    const length = buffer.length;
    const mono = new Float32Array(length);

    for (let channel = 0; channel < channels; channel++) {
        const data = buffer.getChannelData(channel);
        for (let i = 0; i < length; i++) {
            mono[i] += data[i] / channels;
        }
    }

    /*
       Dense min/max rendering keeps transients, subs, mids and highs
       visible instead of reducing the waveform to a smooth blob.
    */
    const columns = Math.max(1, Math.floor(width));
    const samplesPerColumn = Math.max(1, Math.ceil(length / columns));

    ctx.strokeStyle = "#e0b82f";
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let x = 0; x < columns; x++) {
        const start = x * samplesPerColumn;
        const end = Math.min(length, start + samplesPerColumn);

        let min = 1;
        let max = -1;

        for (let i = start; i < end; i++) {
            const value = mono[i];
            if (value < min) min = value;
            if (value > max) max = value;
        }

        const top = height / 2 - max * (height * 0.46);
        const bottom = height / 2 - min * (height * 0.46);

        ctx.moveTo(x + 0.5, top);
        ctx.lineTo(x + 0.5, bottom);
    }

    ctx.stroke();
}

function openSamplerForChannel(channelIndex) {
    const channel = channels[channelIndex];
    if (!channel || !channel.buffer) return;

    samplerState.channelIndex = channelIndex;
    samplerState.buffer = channel.buffer;
    samplerState.pitchCents = channel.pitchCents || 0;
    samplerState.cutSelf = !!channel.cutSelf;
    samplerState.reverse = !!channel.reverse;

    samplerTitle.textContent =
        "sampler - " + channel.name;

    pitchSlider.value =
        samplerState.pitchCents;

    pitchReadout.innerHTML =
        formatPitch(samplerState.pitchCents);

    cutSelf.checked =
        samplerState.cutSelf;

    reverseSample.checked =
        samplerState.reverse;

    samplerWindow.classList.add("open");
    bringToFront(samplerWindow);

    requestAnimationFrame(() => {
        drawWaveform(samplerState.buffer);
    });
}

pitchSlider.addEventListener("input", () => {
    setPitchCents(pitchSlider.value);
});

cutSelf.addEventListener("change", () => {
    samplerState.cutSelf = cutSelf.checked;

    if (samplerState.channelIndex >= 0) {
        channels[samplerState.channelIndex].cutSelf =
            cutSelf.checked;
    }
});

reverseSample.addEventListener("change", () => {
    samplerState.reverse = reverseSample.checked;

    if (samplerState.channelIndex >= 0) {
        channels[samplerState.channelIndex].reverse =
            reverseSample.checked;
    }
});

/* ==========================================================
   PITCH VALUE CONTEXT MENU
========================================================== */

const pitchContextMenu =
    document.getElementById("pitchContextMenu");

const pitchTypeValue =
    document.getElementById("pitchTypeValue");

function hidePitchContextMenu() {
    pitchContextMenu.classList.remove("open");
}

function setPitchCents(cents) {

    cents = Number(cents);

    if (!Number.isFinite(cents)) {
        cents = 0;
    }

    cents = Math.max(
        -1200,
        Math.min(
            1200,
            Math.round(cents)
        )
    );

    pitchSlider.value = cents;
    samplerState.pitchCents = cents;

    if (samplerState.channelIndex >= 0) {
        channels[samplerState.channelIndex].pitchCents =
            cents;
    }

    pitchReadout.innerHTML =
        formatPitch(cents);
}

pitchSlider.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
        event.stopPropagation();

        const menuWidth = 150;
        const menuHeight = 34;

        const left = Math.min(
            event.clientX,
            window.innerWidth - menuWidth - 4
        );

        const top = Math.min(
            event.clientY,
            window.innerHeight - menuHeight - 4
        );

        pitchContextMenu.style.left =
            Math.max(4, left) + "px";

        pitchContextMenu.style.top =
            Math.max(4, top) + "px";

        pitchContextMenu.classList.add("open");

    }
);

pitchTypeValue.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        hidePitchContextMenu();

        const current =
            samplerState.pitchCents || 0;

        const typed =
            prompt(
                "Enter pitch in cents (-1200 to +1200):",
                current >= 0
                    ? "+" + current
                    : String(current)
            );

        if (typed === null) {
            return;
        }

        const value =
            Number(String(typed).trim());

        if (!Number.isFinite(value)) {
            return;
        }

        setPitchCents(value);

    }
);

document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest("#pitchContextMenu")
        ) {
            hidePitchContextMenu();
        }

    }
);

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

        }

    }
);

document.getElementById("closeSampler").addEventListener(

    event => {
        event.stopPropagation();
        samplerWindow.classList.remove("open");
    }
);

window.addEventListener("resize", () => {
    if (
        samplerWindow.classList.contains("open") &&
        samplerState.buffer
    ) {
        drawWaveform(samplerState.buffer);
    }
});

let currentPlaylistColumn = 0;

let schedulerTimer = null;

const SCHEDULE_AHEAD_TIME =
    0.1;

const SCHEDULER_INTERVAL =
    25;

const activeSources = new Map();
let samplerState = {
    channelIndex: -1,
    buffer: null,
    pitchCents: 0,
    cutSelf: false,
    reverse: false
};
const reversedBufferCache = new WeakMap();

/* ==========================================================
   BPM
========================================================== */

function getBPM() {

    let bpm =
        Number(tempoNumber.textContent);

    if (
        !Number.isFinite(bpm)
    ) {

        bpm = 120;

    }

    bpm =
        Math.max(
            30,
            Math.min(
                300,
                bpm
            )
        );

    tempoNumber.textContent =
        bpm;

    return bpm;

}

/* ==========================================================
   STEP DURATION
========================================================== */

function getStepDuration() {

    return (
        60 /
        getBPM()
    ) / 4;

}

/* ==========================================================
   METRONOME
========================================================== */

const METRONOME_URL =
    "https://raw.githubusercontent.com/mrfranco27/spark/main/sounds/wood_tick.wav";

async function loadMetronome() {

    if (metronomeBuffer) {
        return metronomeBuffer;
    }

    const context = getAudioContext();

    try {
        const response = await fetch(METRONOME_URL);

        if (!response.ok) {
            throw new Error(
                "Could not load metronome: " + response.status
            );
        }

        const arrayBuffer =
            await response.arrayBuffer();

        metronomeBuffer =
            await context.decodeAudioData(arrayBuffer);

        return metronomeBuffer;

    } catch (error) {
        console.error(
            "Could not load metronome:",
            error
        );
        return null;
    }
}

function playMetronome(time, accent) {

    if (!metronomeEnabled || !metronomeBuffer) {
        return;
    }

    const context = getAudioContext();
    const source = context.createBufferSource();

    source.buffer = metronomeBuffer;

    if (accent) {
        source.playbackRate.value =
            Math.pow(4, 100 / 1200);
    }

    source.connect(context.destination);
    source.start(time);
}

/* ==========================================================
   PLAY SAMPLE
========================================================== */

function getPlayableBuffer(buffer, reverse) {
    if (!reverse) return buffer;

    let cached = reversedBufferCache.get(buffer);
    if (cached) return cached;

    const context = getAudioContext();
    const reversed = context.createBuffer(
        buffer.numberOfChannels,
        buffer.length,
        buffer.sampleRate
    );

    for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
        const sourceData = buffer.getChannelData(channel);
        const targetData = reversed.getChannelData(channel);
        for (let i = 0; i < sourceData.length; i++) {
            targetData[i] = sourceData[sourceData.length - 1 - i];
        }
    }

    reversedBufferCache.set(buffer, reversed);
    return reversed;
}

function playChannelSample(channel, time, channelIndex = -1) {
    if (!channel.buffer) return;

    const context = getAudioContext();

    if (channel.cutSelf && activeSources.has(channelIndex)) {
        try {
            activeSources.get(channelIndex).stop(time);
        } catch (_) {}
        activeSources.delete(channelIndex);
    }

    const source = context.createBufferSource();
    source.buffer = getPlayableBuffer(channel.buffer, channel.reverse);

    const cents = Number.isFinite(channel.pitchCents)
        ? channel.pitchCents
        : 0;

    source.playbackRate.value =
        Math.pow(2, cents / 1200);

    source.connect(context.destination);
    source.start(time);

    activeSources.set(channelIndex, source);
    source.addEventListener("ended", () => {
        if (activeSources.get(channelIndex) === source) {
            activeSources.delete(channelIndex);
        }
    });
}

/* ==========================================================
   PLAYHEAD
========================================================== */

function clearPlayheads() {
    channelRack
        .querySelectorAll(".step.playing")
        .forEach(cell => cell.classList.remove("playing"));

    playlistGrid
        .querySelectorAll(".playlist-cell.playing")
        .forEach(cell => cell.classList.remove("playing"));
}

function updateRackPlayhead(step) {
    channelRack
        .querySelectorAll(".step.playing")
        .forEach(cell => cell.classList.remove("playing"));

    channelRack
        .querySelectorAll(
            '.step[data-step="' + step + '"]'
        )
        .forEach(cell => cell.classList.add("playing"));
}

function updatePlaylistPlayhead(column, step) {
    if (step !== 0) {
        return;
    }

    playlistGrid
        .querySelectorAll(".playlist-cell.playing")
        .forEach(cell => cell.classList.remove("playing"));

    playlistGrid
        .querySelectorAll(
            '.playlist-cell[data-column="' + column + '"].active'
        )
        .forEach(cell => cell.classList.add("playing"));

    playlistStatus.textContent =
        "column " + (column + 1);
}

/* ==========================================================
   SCHEDULE
========================================================== */

function scheduleRackStep(step, time) {
    const pattern = patterns[currentPattern];

    if (step % 4 === 0) {
        playMetronome(time, step === 0);
    }

    channels.forEach((channel, row) => {
        if (pattern[row][step]) {
            playChannelSample(channel, time, row);
        }
    });

    const delay = Math.max(
        0,
        (time - getAudioContext().currentTime) * 1000
    );

    setTimeout(() => {
        if (playing && !playInPlaylist) {
            updateRackPlayhead(step);
        }
    }, delay);
}

function schedulePlaylistStep(column, step, time) {
    if (step % 4 === 0) {
        playMetronome(time, step === 0);
    }

    for (let pattern = 0; pattern < PATTERN_COUNT; pattern++) {
        if (!playlistRows[pattern].has(column)) {
            continue;
        }

        const patternData = patterns[pattern];

        channels.forEach((channel, row) => {
            if (patternData[row][step]) {
                playChannelSample(channel, time, row);
            }
        });
    }

    const delay = Math.max(
        0,
        (time - getAudioContext().currentTime) * 1000
    );

    setTimeout(() => {
        if (playing && playInPlaylist) {
            updatePlaylistPlayhead(column, step);
        }
    }, delay);
}

/* ==========================================================
   SCHEDULER
========================================================== */

function scheduler() {
    if (!playing) {
        return;
    }

    const context = getAudioContext();

    while (
        nextStepTime <
        context.currentTime +
        SCHEDULE_AHEAD_TIME
    ) {
        if (playInPlaylist) {
            const playlistLength = getPlaylistLength();

            schedulePlaylistStep(
                currentPlaylistColumn,
                currentStep,
                nextStepTime
            );

            nextStepTime += getStepDuration();
            currentStep++;

            if (currentStep >= STEP_COUNT) {
                currentStep = 0;
                currentPlaylistColumn++;

                if (currentPlaylistColumn >= playlistLength) {
                    currentPlaylistColumn = 0;
                }
            }
        } else {
            scheduleRackStep(
                currentStep,
                nextStepTime
            );

            nextStepTime += getStepDuration();
            currentStep++;

            if (currentStep >= STEP_COUNT) {
                currentStep = 0;
            }
        }
    }
}

/* ==========================================================
   START
========================================================== */

async function startSequencer() {
    const context = getAudioContext();

    if (context.state === "suspended") {
        await context.resume();
    }

    playing = true;
    currentStep = 0;
    currentPlaylistColumn = 0;

    nextStepTime =
        context.currentTime +
        0.03;

    playButton.textContent = "Stop";

    if (playInPlaylist) {
        playlistStatus.textContent = "column 1";
    }

    schedulerTimer = setInterval(
        scheduler,
        SCHEDULER_INTERVAL
    );

    scheduler();
}

/* ==========================================================
   STOP
========================================================== */

function stopSequencer() {
    playing = false;

    if (schedulerTimer !== null) {
        clearInterval(schedulerTimer);
        schedulerTimer = null;
    }

    playButton.textContent = "Play";
    currentStep = 0;
    currentPlaylistColumn = 0;

    clearPlayheads();
    playlistStatus.textContent = "playlist";
}

let copiedPattern = null;

function copyCurrentPattern() {

    copiedPattern =
        patterns[currentPattern]
            .map(channel =>
                channel.slice()
            );

}

function pastePattern() {

    if (!copiedPattern) {
        return;
    }

    patterns[currentPattern] =
        copiedPattern.map(channel =>
            channel.slice()
        );

    renderCurrentPattern();

}

/* ==========================================================
   NEW / FULL RESET
========================================================== */

function resetProject() {

    stopSequencer();

    /*
        Stop any samples that are still ringing from
        before the reset.
    */
    activeSources.forEach(source => {
        try {
            source.stop();
        } catch (_) {}
    });

    activeSources.clear();

    /*
        Clear the Edit > Copy clipboard as well.
    */
    copiedPattern = null;

    /*
        Clear every pattern and every step.
    */
    for (
        let pattern = 0;
        pattern < PATTERN_COUNT;
        pattern++
    ) {
        for (
            let row = 0;
            row < ROW_COUNT;
            row++
        ) {
            patterns[pattern][row].fill(false);
        }
    }

    /*
        Remove every loaded sound and restore
        every channel's sampler settings.
    */
    channels.forEach((channel, row) => {

        channel.name =
            "Sample " + (row + 1);

        channel.buffer =
            null;

        channel.pitchCents =
            0;

        channel.cutSelf =
            false;

        channel.reverse =
            false;

        const rowElement =
            channelRack.children[row];

        if (rowElement) {
            const sampleName =
                rowElement.querySelector(".sample-name");

            if (sampleName) {
                sampleName.textContent =
                    "Sample " + (row + 1);
            }
        }

    });

    currentPattern = 0;
    currentStep = 0;
    updatePatternNumber();
    playInPlaylist = false;
    currentPlaylistColumn = 0;

    clearPlaylist();

    tempoNumber.textContent = 120;

    if (loopSetting) {
        loopSetting.value = "leave";
    }

    playlistButton.classList.remove("enabled");
    playlistButton.textContent = "Play in playlist";

    samplerState.channelIndex = -1;
    samplerState.buffer = null;
    samplerState.pitchCents = 0;
    samplerState.cutSelf = false;
    samplerState.reverse = false;

    pitchSlider.value = 0;
    pitchReadout.innerHTML =
        formatPitch(0);

    cutSelf.checked = false;
    reverseSample.checked = false;

    samplerTitle.textContent =
        "sampler";

    samplerWindow.classList.remove("open");
    exportSettingsWindow.classList.remove("open");
    playlistWindow.style.display = "none";

    hidePitchContextMenu();
    closeMenus();

    /*
        Restore the default rack/browser positions
        and their normal expanded state.
    */
    const defaultWindows = [
        {
            element: rackWindow,
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            minimized: false
        },
        {
            element: browserWindow,
            left: "80px",
            top: "80px",
            transform: "none",
            minimized: false
        },
        {
            element: exportSettingsWindow,
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            minimized: false
        },
        {
            element: samplerWindow,
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            minimized: false
        },
        {
            element: playlistWindow,
            left: "50%",
            top: "50%",
            transform: "translate(-50%, -50%)",
            minimized: false
        }
    ];

    defaultWindows.forEach(windowInfo => {

        windowInfo.element.style.left =
            windowInfo.left;

        windowInfo.element.style.top =
            windowInfo.top;

        windowInfo.element.style.transform =
            windowInfo.transform;

        windowInfo.element.classList.remove(
            "minimized"
        );

    });

    document.getElementById("toggleRack").textContent =
        "_";

    document.getElementById("toggleBrowser").textContent =
        "_";

    updatePatternNumber();
    renderCurrentPattern();
}

/* ==========================================================
   WAV EXPORT
========================================================== */

async function exportCurrentPatternAsAudio(
    loopSetting = "leave"
) {

    const pattern =
        patterns[currentPattern];

    const bpm =
        getBPM();

    const stepDuration =
        60 / bpm / 4;

    const barDuration =
        stepDuration * STEP_COUNT;

    const sampleRate =
        44100;

    /*
        "cut remainder" exports exactly one bar.
        "leave remainder" extends the export long enough
        for the final sample to finish naturally.
    */
    let renderDuration =
        barDuration;

    if (loopSetting === "leave") {

        for (
            let row = 0;
            row < ROW_COUNT;
            row++
        ) {

            const channel =
                channels[row];

            if (!channel.buffer) {
                continue;
            }

            for (
                let step = 0;
                step < STEP_COUNT;
                step++
            ) {

                if (!pattern[row][step]) {
                    continue;
                }

                renderDuration =
                    Math.max(
                        renderDuration,
                        step * stepDuration +
                        channel.buffer.duration /
                        Math.pow(2, (Number(channel.pitchCents) || 0) / 1200)
                    );

            }

        }

    }

    const renderLength =
        Math.ceil(
            renderDuration * sampleRate
        );

    const offlineContext =
        new OfflineAudioContext(
            2,
            renderLength,
            sampleRate
        );

    // Track offline sources so cutself behaves exactly like the live sampler.
    const offlineActiveSources = new Map();

    for (
        let step = 0;
        step < STEP_COUNT;
        step++
    ) {

        const time =
            step * stepDuration;

        for (
            let row = 0;
            row < ROW_COUNT;
            row++
        ) {

            if (
                !pattern[row][step]
            ) {
                continue;
            }

            const channel =
                channels[row];

            if (!channel.buffer) {
                continue;
            }

            // cutself: stop the previous note from this channel when a new one starts.
            if (channel.cutSelf && offlineActiveSources.has(row)) {
                try {
                    offlineActiveSources.get(row).stop(time);
                } catch (error) {
                    // Source may already have ended; nothing to do.
                }
            }

            const source =
                offlineContext.createBufferSource();

            source.buffer =
                getPlayableBuffer(channel.buffer, !!channel.reverse);

            const pitchCents =
                Number.isFinite(Number(channel.pitchCents))
                    ? Number(channel.pitchCents)
                    : 0;

            source.playbackRate.value =
                Math.pow(2, pitchCents / 1200);

            source.connect(
                offlineContext.destination
            );

            source.start(time);

            offlineActiveSources.set(row, source);

        }

    }

    const rendered =
        await offlineContext.startRendering();

    const wavBlob =
        audioBufferToWav(
            rendered,
            renderLength
        );

    const url =
        URL.createObjectURL(wavBlob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        "pattern-" +
        (currentPattern + 1) +
        "-" +
        bpm +
        "bpm.wav";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        () => {

            URL.revokeObjectURL(url);

        },
        1000
    );

}

/* ==========================================================
   AUDIO BUFFER -> WAV
========================================================== */

function audioBufferToWav(
    buffer,
    frameCount
) {

    const channelCount =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const bytesPerSample =
        2;

    const blockAlign =
        channelCount *
        bytesPerSample;

    const dataSize =
        frameCount *
        blockAlign;

    const wavSize =
        44 +
        dataSize;

    const arrayBuffer =
        new ArrayBuffer(wavSize);

    const view =
        new DataView(arrayBuffer);

    let offset = 0;

    function writeString(string) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset++,
                string.charCodeAt(i)
            );

        }

    }

    function writeUint32(value) {

        view.setUint32(
            offset,
            value,
            true
        );

        offset += 4;

    }

    function writeUint16(value) {

        view.setUint16(
            offset,
            value,
            true
        );

        offset += 2;

    }

    writeString("RIFF");
    writeUint32(36 + dataSize);
    writeString("WAVE");

    writeString("fmt ");
    writeUint32(16);
    writeUint16(1);
    writeUint16(channelCount);
    writeUint32(sampleRate);
    writeUint32(sampleRate * blockAlign);
    writeUint16(blockAlign);
    writeUint16(16);

    writeString("data");
    writeUint32(dataSize);

    const channelData = [];

    for (
        let channel = 0;
        channel < channelCount;
        channel++
    ) {

        channelData.push(
            buffer.getChannelData(channel)
        );

    }

    for (
        let frame = 0;
        frame < frameCount;
        frame++
    ) {

        for (
            let channel = 0;
            channel < channelCount;
            channel++
        ) {

            let sample =
                channelData[channel][frame];

            if (
                !Number.isFinite(sample)
            ) {

                sample = 0;

            }

            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

            const value =
                sample < 0
                    ? sample * 32768
                    : sample * 32767;

            view.setInt16(
                offset,
                value,
                true
            );

            offset += 2;

        }

    }

    return new Blob(
        [arrayBuffer],
        {
            type: "audio/wav"
        }
    );

}

/* ==========================================================
   EXPORT SETTINGS
========================================================== */

const exportSettings =
    document.getElementById("exportSettings");

const loopSetting =
    document.getElementById("loopSetting");

const exportButton =
    document.getElementById("exportButton");

const closeExportSettings =
    document.getElementById("closeExportSettings");

closeExportSettings.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        exportSettings.classList.remove("open");

    }
);

async function exportWithSettings() {

    const setting =
        loopSetting.value;

    try {

        await exportCurrentPatternAsAudio(
            setting
        );

        exportSettings.classList.remove("open");

    } catch (error) {

        console.error(
            "Could not export pattern:",
            error
        );

        alert(
            "Could not export pattern audio."
        );

    }

}

exportButton.addEventListener(
    "click",
    exportWithSettings
);

/* ==========================================================
   EXPORT MENU
========================================================== */

document.getElementById(
    "exportAudio"
).addEventListener(
    "click",
    event => {

        event.stopPropagation();

        closeMenus();

        exportSettings.classList.add("open");

        bringToFront(exportSettings);

    }
);

/* ==========================================================
   SPACEBAR PLAY / STOP
========================================================== */

document.addEventListener("keydown", async event => {
    if (event.code !== "Space") return;

    const tag = event.target && event.target.tagName;
    if (
        tag === "INPUT" ||
        tag === "SELECT" ||
        tag === "TEXTAREA"
    ) {
        return;
    }

    event.preventDefault();

    if (event.repeat) return;

    if (playing) {
        stopSequencer();
    } else {
        await startSequencer();
    }
});

/* ==========================================================
   INITIAL STATE
========================================================== */

currentPattern = 0;

playInPlaylist = false;

playlistButton.classList.remove(
    "enabled"
);

playlistButton.textContent =
    "Play in playlist";

updatePatternNumber();

renderCurrentPattern();

/* ==========================================================
   GLOBAL BEHAVIOR
========================================================== */

document.addEventListener(
    "contextmenu",
    event => {

        /*
            Allow the step grid to handle
            right-click removal itself.
        */

        if (
            event.target.closest(".step") ||
            event.target.closest(".playlist-cell")
        ) {
            return;
        }

        event.preventDefault();

    }
);

document.addEventListener(
    "selectstart",
    event => {

        event.preventDefault();

    }
);

document.addEventListener(
    "dragstart",
    event => {

        if (
            event.target.closest(".tree-file") ||
            event.target.closest(".titlebar")
        ) {

            return;

        }

    }
);
